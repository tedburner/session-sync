name: Release macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # GitHub-hosted arm64 macOS runner (macos-14 image is retired); Intel Macs
    # would need a separate x64 job.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check runner architecture
        run: |
          arch="$(uname -m)"
          echo "runner arch: $arch"
          if [ "$arch" != "arm64" ]; then
            echo "::error::需要 arm64 runner，当前是 $arch"
            exit 1
          fi

      - name: Resolve version
        id: meta
        run: |
          version="$("$pythonLocation/bin/python3" -c 'import sys; sys.path.insert(0, "src"); import session_sync; print(session_sync.__version__)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与项目版本 $VERSION 不一致"
            exit 1
          fi

      - name: Run unit tests
        run: PYTHONPATH=src:tests "$pythonLocation/bin/python3" -m unittest discover -s tests

      - name: Build .app
        run: PYTHON="$pythonLocation/bin/python3" ./scripts/build-app.sh

      - name: Package zip
        id: package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          name="Session-Sync-${VERSION}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Session Sync.app" "dist/$name"
          shasum -a 256 "dist/$name" | tee "dist/$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "dist/$name.sha256")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Session-Sync-macos-arm64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NAME: ${{ steps.package.outputs.name }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          cat > release-notes.md <<EOF
          session-sync $GITHUB_REF_NAME

          ## 下载

          - \`$NAME\`：macOS Apple Silicon 自包含应用，解压后双击启动，无需安装 Python。

          ## 首次打开

          应用未签名/未公证；若被 Gatekeeper 拦截，请右键「打开」，或执行：

          \`\`\`bash
          xattr -dr com.apple.quarantine "Session Sync.app"
          \`\`\`

          GUI 优先使用 Chrome \`--app\` 独立窗口，未安装时回退默认浏览器。所有处理均在本地完成。

          SHA256: \`$SHA256\`
          EOF

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/$NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
