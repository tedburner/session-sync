[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "session-sync"
version = "0.0.2"
description = "Cross-harness coding-agent session migration: Claude Code / Codex / ZCode / Qoder / Pi / DeepSeek dsh / WorkBuddy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
session-sync = "session_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
